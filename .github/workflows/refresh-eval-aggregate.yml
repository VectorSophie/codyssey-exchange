name: refresh-eval-aggregate

on:
  schedule:
    - cron: "0 19 * * 1" # 매주 월요일 04:00 KST — 3개월 누적 집계라 매일 다시 계산할 이유가 없다
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run refresh:eval
