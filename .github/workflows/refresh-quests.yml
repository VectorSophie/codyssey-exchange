name: refresh-quests

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST — codyssey_Quest_Tracker 스냅샷은 매일 바뀐다
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run refresh:quests
