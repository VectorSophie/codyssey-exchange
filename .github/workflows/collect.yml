name: collect

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      # CODYSSEY_SESSION은 로그인 쿠키 문자열 — 로그아웃하거나 만료되면 이 잡은 "세션 만료"로 실패하고 DB는 그대로 남는다
      - working-directory: app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CODYSSEY_SESSION: ${{ secrets.CODYSSEY_SESSION }}
        run: npm run collect
